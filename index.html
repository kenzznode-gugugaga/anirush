<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniRush — Nonton Anime Sub Indo</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: 'Segoe UI', sans-serif;
    background: #0d0d0d;
    color: white;
    height: 100vh;
    display: flex;
    flex-direction: column;
}
.top-bar {
    background: #1a1a1a;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #a855f7;
}
.logo {
    font-size: 20px;
    font-weight: bold;
    color: #a855f7;
}
.logo span { color: #06b6d4; }
.nav-links a {
    color: #aaa;
    text-decoration: none;
    margin-left: 15px;
    font-size: 14px;
    transition: color 0.3s;
}
.nav-links a:hover { color: #fff; }
.iframe-container {
    flex: 1;
    width: 100%;
}
.iframe-container iframe {
    width: 100%;
    height: 100%;
    border: none;
}
.footer {
    background: #111;
    padding: 8px;
    text-align: center;
    font-size: 12px;
    color: #666;
}
</style>
</head>
<body>

<div class="top-bar">
    <div class="logo">Ani<span>Rush</span></div>
    <div class="nav-links">
        <a href="#" onclick="changeSite('otakudesu')">Otakudesu</a>
        <a href="#" onclick="changeSite('samehadaku')">Samehadaku</a>
        <a href="#" onclick="changeSite('kuramanime')">Kuramanime</a>
    </div>
</div>

<div class="iframe-container">
    <iframe id="mainFrame" src="https://otakudesu.cam/" allowfullscreen></iframe>
</div>

<div class="footer">
    © 2026 AniRush — Semua konten dari sumber eksternal. Jangan lupa dukung situs resmi.
</div>

<script>
function changeSite(site) {
    const frame = document.getElementById('mainFrame');
    const urls = {
        'otakudesu': 'https://otakudesu.cam/',
        'samehadaku': 'https://samehadaku.email/',
        'kuramanime': 'https://kuramanime.com/'
    };
    frame.src = urls[site];
    alert('Sekarang lo lagi nonton dari ' + site + '!');
}
</script>

</body>
</html>
